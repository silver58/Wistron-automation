<title>Lanternbound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: a brass handheld console centered on a dusk-blue page; single dark theme by design */
:root{
  color-scheme:dark;
  --page:#1b1d2b; --shell:#e9b949; --shell-dark:#b9862a; --shell-light:#f7d77e;
  --ink:#2a2230; --muted:#c9c3d9; --btn:#7a2f3a; --btn-dark:#4e1b24;
  --pixel:"Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--muted)}
body{margin:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font:14px/1.5 system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.console{max-width:700px;margin:0 auto;background:linear-gradient(160deg,var(--shell-light),var(--shell) 30%,var(--shell-dark));border-radius:18px 18px 56px 18px;padding:22px 22px 26px;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 -6px 0 rgba(0,0,0,.15)}
.bezel{background:#3a3346;border-radius:10px 10px 30px 10px;padding:16px 16px 12px}
.bezel .lamp{display:flex;align-items:center;gap:8px;font:8px var(--pixel);color:#b9b1cc;margin:0 0 8px 4px;letter-spacing:1px}
.bezel .lamp i{width:8px;height:8px;border-radius:50%;background:#ffcf4a;box-shadow:0 0 8px #ffcf4a}
canvas{display:block;width:100%;max-width:640px;height:auto;margin:0 auto;image-rendering:pixelated;border-radius:2px;background:#000;touch-action:none}
.brand{font:12px var(--pixel);color:var(--btn-dark);margin:12px 4px 0;letter-spacing:1px}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
.dpad button{background:#2d2836;border:0;color:#8f86a6;font-size:16px;touch-action:none}
.dpad .up{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .left{grid-area:2/1;border-radius:6px 0 0 6px}
.dpad .mid{grid-area:2/2;background:#2d2836;pointer-events:none}.dpad .right{grid-area:2/3;border-radius:0 6px 6px 0}
.dpad .down{grid-area:3/2;border-radius:0 0 6px 6px}
.ab{display:flex;gap:16px;transform:rotate(-20deg)}
.ab button{width:62px;height:62px;border-radius:50%;background:var(--btn);border:0;color:#f3d0d5;font:14px var(--pixel);box-shadow:0 4px 0 var(--btn-dark);touch-action:none}
.ab button:active,.dpad button:active,.start button:active{transform:translateY(2px)}
.start{display:flex;flex-direction:column;align-items:center;gap:6px}
.start button{width:64px;height:16px;border-radius:8px;background:#5f5868;border:0;transform:rotate(-20deg);touch-action:none}
.start span{font:8px var(--pixel);color:var(--btn-dark)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.keys{max-width:700px;margin:16px auto 0;font-size:13px;text-align:center;color:var(--muted)}
.keys kbd{font:10px var(--pixel);background:#2d2836;border-radius:4px;padding:3px 6px;color:#f0e6c8}
@media (max-width:520px){
  .console{padding:12px 12px 18px;border-radius:14px 14px 36px 14px}
  .bezel{padding:10px 10px 8px}
  .dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}
  .ab button{width:54px;height:54px}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="console">
  <div class="bezel">
    <div class="lamp"><i></i>POWER</div>
    <canvas id="screen" width="640" height="576" tabindex="0" aria-label="Lanternbound game screen"></canvas>
  </div>
  <div class="brand">LANTERNBOUND</div>
  <div class="controls">
    <div class="dpad">
      <button class="up" data-b="up" aria-label="Up">▲</button>
      <button class="left" data-b="left" aria-label="Left">◀</button>
      <span class="mid"></span>
      <button class="right" data-b="right" aria-label="Right">▶</button>
      <button class="down" data-b="down" aria-label="Down">▼</button>
    </div>
    <div class="start"><button data-b="start" aria-label="Menu"></button><span>MENU</span></div>
    <div class="ab"><button data-b="b" aria-label="B">B</button><button data-b="a" aria-label="A">A</button></div>
  </div>
</div>
<p class="keys"><kbd>Arrows</kbd>/<kbd>WASD</kbd> move · <kbd>Z</kbd>/<kbd>Space</kbd> A (talk, confirm) · <kbd>X</kbd>/<kbd>Esc</kbd> B (back) · <kbd>Enter</kbd> menu</p>

    if (waiter && waiter.kind === 'msg' && ui.typed >= ui.text.length && Math.floor(now / 400) % 2) { g.fillStyle = INK; g.beginPath(); g.moveTo(596, 540); g.lineTo(612, 540); g.lineTo(604, 550); g.fill(); }
  }
  if (!c) return;
  const L = c.cfg.layout || 'box';
  if (L === 'cmd') {
    box(320, 416, 320, 160);
    c.opts.forEach((o, i) => { const x = 360 + (i % 2) * 136, y = 452 + Math.floor(i / 2) * 52; if (i === c.idx) cursor(x - 22, y); txt(o.label, x, y); });
  } else if (L === 'moves') {
    box(0, 416, 640, 160);
    c.opts.forEach((o, i) => { const x = 52 + (i % 2) * 300, y = 444 + Math.floor(i / 2) * 40; if (i === c.idx) cursor(x - 22, y); txt(o.label, x, y, INK, 14); });
    const mv = c.cfg.info(c.idx); g.fillStyle = TYPE_COL[mv.type]; g.fillRect(28, 528, 120, 26);
    txt(mv.type.toUpperCase(), 88, 534, '#fff', 12, 'center');
    txt(mv.pow ? `POWER ${mv.pow}  ACC ${mv.acc}${mv.prio ? '  FAST' : ''}` : mv.heal ? 'HEALS YOU' : 'STATUS MOVE', 164, 534, INK, 12);
    if (B && mv.pow) { const e = eff(mv.type, SP[B.foe.id].type); if (e !== 1) txt(e > 1 ? 'STRONG!' : 'WEAK', 610, 534, e > 1 ? '#2e8b3e' : '#c0392b', 12, 'right'); }
  } else if (L === 'title') {
    c.opts.forEach((o, i) => { const y = 470 + i * 40; if (i === c.idx) { g.fillStyle = '#ffd65a'; g.beginPath(); g.moveTo(220, y); g.lineTo(230, y + 7); g.lineTo(220, y + 14); g.fill(); } txt(o.label, 250, y, i === c.idx ? '#ffd65a' : '#e8dcf5'); });
  } else if (L === 'none') {
    txt('Press A', 320, 520, '#ffd65a', 14, 'center');
  } else if (L === 'box') {
    const w = Math.max(...c.opts.map(o => o.label.length)) * 16 + 76, h = c.opts.length * 40 + 40;
    const x = 640 - w, y = c.cfg.pos === 'top' ? 0 : (ui.text != null ? 416 - h : 576 - h);
    box(x, y, w, h);
    c.opts.forEach((o, i) => { const yy = y + 26 + i * 40; if (i === c.idx) cursor(x + 22, yy); txt(o.label, x + 44, yy, o.disabled ? '#a89f94' : INK); });
  }
}

// ================= main loop =================
let last = performance.now();
function update(dt, now) {
  if (ui.text != null && ui.typed < ui.text.length) ui.typed += dt * .09;
  updParts(dt);
  if (fade.a !== fade.to) { const s = fade.speed * dt; fade.a = Math.abs(fade.to - fade.a) <= s ? fade.to : fade.a + Math.sign(fade.to - fade.a) * s; }
  const ents = [player, partnerEnt, ...NPCS].filter(Boolean);
  for (const e of ents) if (e.t < 1) e.t = Math.min(1, e.t + dt / (e.dur || STEP_MS));
  const tw = m => { if (m && m.dispHp !== m.hp) { const s = m.maxHp * dt / 900; m.dispHp = Math.abs(m.hp - m.dispHp) <= s ? m.hp : m.dispHp + Math.sign(m.hp - m.dispHp) * s; } };
  if (B) { tw(B.foe); tw(B.me); }
  if (mode === 'world' && player) {
    const py = player.y, rate = dt / 1000 * (RM ? .4 : 1);
    if (py >= 42 && rnd() < 1.3 * rate) spawnP({ sp: 'world', x: CAM.x - 60 + rnd() * 640, y: CAM.y - 20, vx: 40 + rnd() * 30, vy: 30 + rnd() * 25, wob: 40, shape: 'leaf', size: 3 + rnd() * 2, col: pickc(['#ffd1e0', '#fff4f0', '#f7a8c4', '#a6e27e']), life: 9000, spin: 2.5 });
    if (py < 42 && py >= 17 && rnd() < 4 * rate) spawnP({ sp: 'world', x: CAM.x + rnd() * 640, y: CAM.y + rnd() * 576, vx: rnd() * 30 - 15, vy: rnd() * 20 - 10, wob: 20, shape: 'soft', size: 10 + rnd() * 6, col: 'rgba(215,255,120,.95)', glow: true, blink: true, life: 4000, fadeIn: 600 });
    if (py < 42 && !P.flags.ending && rnd() < 1.6 * rate) spawnP({ sp: 'world', x: CAM.x - 120 + rnd() * 760, y: CAM.y + rnd() * 576, vx: 14 + rnd() * 16, vy: rnd() * 6 - 3, shape: 'soft', size: 70 + rnd() * 90, col: 'rgba(225,220,245,.32)', life: 7000, fadeIn: 2200 });
    if (py < 17 && P.flags.ending && rnd() < 2 * rate) spawnP({ sp: 'world', x: CAM.x + rnd() * 640, y: CAM.y + 600, vy: -50 - rnd() * 40, wob: 20, shape: 'soft', size: 12 + rnd() * 8, col: 'rgba(255,200,100,.9)', glow: true, life: 8000, fadeIn: 600 });
    if (player.t >= 1 && stepDone) { stepDone = false; onStep(); }
    if (!busy && !waiter && player.t >= 1 && !stepDone && dirStack.length) tryMove(dirStack[dirStack.length - 1]);
  }
}
function render(now) {
  g.imageSmoothingEnabled = false;
  g.save();
  if (shakeFx) { const k = (now - shakeFx.t0) / shakeFx.ms; if (k < 1) { const m = shakeFx.mag * (1 - k); g.translate(Math.round((rnd() * 2 - 1) * m), Math.round((rnd() * 2 - 1) * m)); } else shakeFx = null; }
  if (mode === 'title') drawTitle(now);
  else if (mode === 'intro') drawIntro(now);
  else if (mode === 'battle' && B) drawBattle(now);
  else if (mode === 'evolve' && EVO) drawEvolve(now);
  else if (mode === 'credits') drawCredits(now);
  else if (player) drawWorld(now);
  g.restore();
  if (flashFx) { const k = (now - flashFx.t0) / flashFx.ms; if (k < 1) { g.globalAlpha = flashFx.a * (1 - k); g.fillStyle = flashFx.col; g.fillRect(0, 0, 640, 576); g.globalAlpha = 1; } else flashFx = null; }
  if (transFx) drawTransition(now);
  if (mode === 'battle' && B && B.openT) { const k = (now - B.openT) / 450; if (k < 1) { g.fillStyle = '#141228'; const h = 288 * (1 - k * k); g.fillRect(0, 0, 640, h); g.fillRect(0, 576 - h, 640, h); } }
  drawUI(now);
  if (fade.a > 0) { g.fillStyle = `rgba(20,18,40,${fade.a})`; g.fillRect(0, 0, 640, 576); }
}
function frame(now) { const dt = Math.min(50, now - last); last = now; update(dt, now); render(now); requestAnimationFrame(frame); }
addEventListener('visibilitychange', () => { if (document.hidden && P && player && mode === 'world') save(true); });

Promise.race([document.fonts ? document.fonts.load(`16px ${FONT}`) : 0, sleep(1500)]).catch(() => {}).then(() => {
  requestAnimationFrame(frame);
  run(title);
});
</script>
