<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wistron — Machines</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root{
  --bg:#0d1117;--sur:#161b22;--sur2:#1c2128;--bdr:#21262d;--bdr2:#30363d;
  --amb:#00a3e0;--amb-rgb:0,163,224;--amb-hover:#0086b8;
  --grn:#3fb950;--red:#f85149;--blu:#388bfd;--pur:#a371f7;--cyn:#39c5cf;--ora:#ff8c42;--yel:#f5d937;
  --txt:#e6edf3;--mut:#d0d7de;--mut2:#b1bac4;
}
*{box-sizing:border-box;margin:0;padding:0;}
button{touch-action:manipulation;cursor:pointer;}
body{
  font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-bottom:40px;
}

.site-header{
  background:var(--sur);border-bottom:1px solid var(--bdr);
  padding:0 24px;display:flex;align-items:center;justify-content:space-between;
  height:56px;position:sticky;top:0;z-index:100;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--bdr2);color:var(--mut);
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  padding:5px 11px;border-radius:6px;text-decoration:none;
  transition:all .15s;
}
.back-btn:hover{border-color:var(--amb);color:var(--amb);}
.brand{
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
  color:var(--amb);letter-spacing:.08em;text-transform:uppercase;
}
.lang-btn{
  background:transparent;border:1px solid var(--bdr2);color:var(--mut);
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  padding:5px 11px;border-radius:6px;
}

.wrap{max-width:1100px;margin:0 auto;padding:30px 28px;}

.page-head{
  margin-bottom:24px;
  padding-bottom:18px;
  border-bottom:1px solid var(--bdr);
}
.page-title{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  margin-bottom:4px;
}
.page-title h1{
  font-size:26px;font-weight:600;letter-spacing:-.01em;
}
.page-title .area-pill{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  padding:3px 10px;border-radius:12px;
  background:rgba(var(--amb-rgb),.15);
  color:var(--amb);
  text-transform:uppercase;letter-spacing:.06em;font-weight:600;
}
.page-sub{
  font-size:13px;color:var(--mut);
}

/* Machine grid — responsive cards */
.machines{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
  gap:12px;
}
.machine-card{
  background:linear-gradient(135deg, var(--sur) 0%, #14191f 100%);
  border:1px solid var(--bdr);
  border-radius:10px;
  padding:18px 18px 16px;
  text-decoration:none;color:var(--txt);
  display:flex;flex-direction:column;gap:8px;
  transition:all .15s;
  min-height:120px;
}
.machine-card:hover{
  transform:translateY(-2px);
  border-color:var(--amb);
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
.machine-code{
  font-family:'IBM Plex Mono',monospace;
  font-size:18px;font-weight:600;
  letter-spacing:.04em;
  color:var(--txt);
}
.machine-meta{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  color:var(--mut2);
  margin-top:auto;
  display:flex;align-items:center;justify-content:space-between;gap:6px;
}
.machine-low-badge{
  background:rgba(248,81,73,.18);color:#ffa3a3;
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  padding:2px 6px;border-radius:8px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;
}

.empty{
  text-align:center;
  padding:50px 20px;
  background:var(--sur);
  border:2px dashed var(--bdr2);
  border-radius:11px;
  color:var(--mut2);
}
.empty h2{font-size:16px;color:var(--txt);margin-bottom:8px;font-weight:600;}
.empty p{font-size:13px;max-width:380px;margin:0 auto;line-height:1.5;}

.loading{
  text-align:center;padding:60px 20px;
  color:var(--mut2);font-family:'IBM Plex Mono',monospace;font-size:12px;
}

.notice{
  background:rgba(var(--amb-rgb),.06);
  border:1px solid rgba(var(--amb-rgb),.22);
  border-radius:8px;padding:12px 14px;
  font-size:12.5px;color:var(--mut);
  margin-bottom:16px;
}
.notice.err{background:rgba(248,81,73,.08);border-color:rgba(248,81,73,.25);}
.notice code{background:var(--bg);padding:1px 5px;border-radius:3px;font-size:11px;font-family:'IBM Plex Mono',monospace;}
</style>
<script src="wistron_config.js"></script>
<script src="translations.js"></script>
</head>
<body>

<header class="site-header">
  <a class="back-btn" href="index.html">← <span data-i18n="common.home">Home</span></a>
  <span class="brand">WISTRON · MACHINES</span>
  <button id="langBtn" class="lang-btn" onclick="cycleLang()">EN</button>
</header>

<main class="wrap">
  <div class="page-head">
    <div class="page-title">
      <h1 id="areaName">—</h1>
      <span class="area-pill" id="areaPill">—</span>
    </div>
    <div class="page-sub" data-i18n="machine.tap">Tap a machine to view its parts</div>
  </div>

  <div id="content"><div class="loading" data-i18n="common.loading">Loading…</div></div>
</main>

<script>
// Pull the ?area= param. We strict-match against the seeded list so a typo
// in the URL doesn't return random machines from another area.
const VALID_AREAS = ['DIP Line', 'Line 1', 'Line 2', 'PODS', 'Line 4', 'Pack Out'];

function getArea(){
  const params = new URLSearchParams(window.location.search);
  const a = (params.get('area') || '').trim();
  return VALID_AREAS.includes(a) ? a : null;
}

const area = getArea();
if(!area){
  document.getElementById('content').innerHTML = `
    <div class="empty"><h2>Area not found</h2>
    <p>The URL doesn't specify a valid area. Head back to the home page and pick one.</p></div>`;
  document.getElementById('areaName').textContent = '—';
} else {
  document.getElementById('areaName').textContent = area;
  document.getElementById('areaPill').textContent = area;
  document.title = `Wistron — ${area}`;
  loadMachines();
}

async function loadMachines(){
  const slot = document.getElementById('content');
  if(!window.WISTRON_SB_URL || window.WISTRON_SB_URL.includes('YOUR-PROJECT-REF')){
    slot.innerHTML = `<div class="notice err">
      <strong>Setup needed:</strong> Replace the placeholders in <code>wistron_config.js</code> with your Supabase URL and anon key.
    </div>`;
    return;
  }
  try {
    // Fetch machines AND their part counts in two parallel calls. Doing it
    // in parallel keeps the page snappy even with many machines.
    const [machinesRes, partsRes] = await Promise.all([
      fetch(`${WISTRON_SB_URL}/rest/v1/machines?area=eq.${encodeURIComponent(area)}&order=display_order.asc&limit=200`, {headers: wistronHeaders()}),
      fetch(`${WISTRON_SB_URL}/rest/v1/machine_parts?select=machine_id,quantity,reorder_threshold&limit=2000`, {headers: wistronHeaders()}),
    ]);
    if(!machinesRes.ok){
      slot.innerHTML = `<div class="notice err">
        <strong>Database not set up yet.</strong> Run <code>supabase_setup.sql</code> in Supabase to create the tables.
      </div>`;
      return;
    }
    const machines = await machinesRes.json();
    const parts = partsRes.ok ? await partsRes.json() : [];

    if(machines.length === 0){
      slot.innerHTML = `<div class="empty"><h2 data-i18n="machine.no_machines">No machines configured for this area yet.</h2>
        <p>An engineer can add machines from the Parts Master screen.</p></div>`;
      applyTranslations(getCurrentLang());
      return;
    }

    // Index parts by machine_id — counts + how many are low stock
    const partInfo = {};   // id → {count, low}
    parts.forEach(p => {
      if(!partInfo[p.machine_id]) partInfo[p.machine_id] = { count:0, low:0 };
      partInfo[p.machine_id].count++;
      if(p.reorder_threshold != null && p.quantity <= p.reorder_threshold){
        partInfo[p.machine_id].low++;
      }
    });

    slot.innerHTML = '<div class="machines">' + machines.map(m => {
      const info = partInfo[m.id] || {count:0, low:0};
      const lowBadge = info.low > 0
        ? `<span class="machine-low-badge" title="${info.low} low-stock part(s)">${info.low} LOW</span>`
        : '';
      return `
        <a class="machine-card" href="machine.html?id=${m.id}">
          <div class="machine-code">${escapeHtml(m.machine_code)}</div>
          <div class="machine-meta">
            <span>${info.count} part${info.count===1?'':'s'}</span>
            ${lowBadge}
          </div>
        </a>`;
    }).join('') + '</div>';
  } catch(e){
    slot.innerHTML = `<div class="notice err"><strong>Error loading:</strong> ${escapeHtml(e.message)}</div>`;
  }
}

function escapeHtml(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>

</body>
</html>
